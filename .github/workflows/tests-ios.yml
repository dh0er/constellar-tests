name: iOS

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo that triggered this workflow"
        required: false
        default: ""
      source_ref:
        description: "Git ref in the source repo to test (e.g. refs/pull/123/merge or refs/heads/main)"
        required: false
        default: ""
      source_sha:
        description: "Commit SHA in the source repo to test (optional)"
        required: false
        default: ""
      source_pr:
        description: "PR number in the source repo (optional)"
        required: false
        default: ""

concurrency:
  group: >-
    tests-ios-${{ inputs.source_repo || github.repository }}-${{ inputs.source_pr || inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests on iOS Simulator (shard ${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      REPO_PATH: ${{ secrets.REPO_PATH }}
      ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
      IOS_MAX_RUNTIME_MAJOR: "27"
      TEST_SHARD_INDEX: ${{ matrix.shard }}
      TEST_SHARD_TOTAL: "3"
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH (deploy key)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.REPO_SSH_KEY }}
      - name: Trust github.com host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Clone repository
        run: git clone --quiet "${{ secrets.REPO_PATH }}" repo
      - name: Checkout requested source ref/SHA (optional)
        if: ${{ inputs.source_ref != '' || inputs.source_sha != '' }}
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.source_ref }}" ]; then
            git fetch --quiet --no-tags --prune origin "${{ inputs.source_ref }}"
            git checkout --quiet --detach FETCH_HEAD
          elif [ -n "${{ inputs.source_sha }}" ]; then
            git fetch --quiet --no-tags --prune origin "${{ inputs.source_sha }}" || true
            git checkout --quiet --detach "${{ inputs.source_sha }}"
          fi
      - name: Check integration sharding support in source repo
        id: shard-support
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "TEST_SHARD_INDEX" repo/test.py 2>/dev/null; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "run_shard=true" >> "$GITHUB_OUTPUT"
            echo "Source repo supports integration sharding (shard ${{ matrix.shard }}/${{ env.TEST_SHARD_TOTAL }})."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ matrix.shard }}" == "0" ]]; then
              echo "run_shard=true" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks sharding support; shard 0 will run the full suite."
            else
              echo "run_shard=false" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks sharding support; shard ${{ matrix.shard }} exiting early."
            fi
          fi
      - name: Select Xcode & pre-boot iOS Simulator in background
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          UDID="$(/usr/bin/python3 - <<'PY'
          import json, os, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          cands = []
          for rt, devs in data.get("devices", {}).items():
              if "iOS" not in rt:
                  continue
              for d in devs:
                  if d.get("isAvailable", True) and "iPhone" in d.get("name", ""):
                      cands.append((rt, d["name"], d["udid"]))
          if not cands:
              sys.exit(0)
          def ver(rt):
              m = re.search(r"iOS-(\d+)(?:-(\d+))?(?:-(\d+))?", rt)
              return tuple(int(x) for x in m.groups(default="0")) if m else (0, 0, 0)
          max_major = int(os.environ.get("IOS_MAX_RUNTIME_MAJOR", "27"))
          stable = [c for c in cands if ver(c[0])[0] <= max_major]
          if stable:
              cands = stable
          def form_rank(name):
              if re.search(r"duo|fold|flip", name, re.IGNORECASE):
                  return 0
              if re.fullmatch(r"iPhone \d+", name):
                  return 3
              if re.fullmatch(r"iPhone \d+ (Pro|Plus)", name):
                  return 2
              return 1
          rt, name, udid = max(cands, key=lambda t: (form_rank(t[1]) > 0, ver(t[0]), form_rank(t[1])))
          print(f"Pre-booting iOS Simulator in background: {name} ({rt}) [{udid}]", file=sys.stderr)
          print(udid)
          PY
          )"
          if [[ -n "${UDID}" ]]; then
            echo "IOS_PREBOOTED_UDID=${UDID}" >> "$GITHUB_ENV"
            # Fire-and-forget boot via CoreSimulatorService without waiting for
            # bootstatus: cold first-boot daemons now run in parallel with
            # Flutter setup, SwiftPM cache restore, pub get, and build_runner.
            xcrun simctl boot "${UDID}" >/dev/null 2>&1 || true
          fi
      - uses: actions/setup-python@v7
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          python-version: "3.11"
      - name: Read pinned Flutter version from source repo
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        id: flutter-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f repo/.flutter-version ]]; then
            version="$(tr -d '\r\n' < repo/.flutter-version)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Flutter pin: $version" >&2; exit 1; }
          else
            # Source refs from before the pin (e.g. main) keep the previous toolchain.
            version="3.41.2"
            echo "No .flutter-version in the source repo; falling back to Flutter $version"
          fi
          echo "Using Flutter $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: "stable"
          cache: true
      - name: Cache SwiftPM packages (shared iOS + macOS)
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-apple-v1-${{ hashFiles('repo/ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'repo/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-apple-v1-
      - uses: actions/setup-node@v7
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          ruby-version: "3.3"
      - name: Run interpreter (execute 'run' steps from cloned workflow)
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        env:
          CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
        run: node .github/scripts/ci_crypto.mjs wrap -- ruby .github/scripts/run_workflow_run_steps.rb --workflow repo/.github/workflows/tests-ios.yml --job layer1-tests --default-working-directory repo
      - name: Print app crash reports
        if: ${{ always() && steps.shard-support.outputs.run_shard == 'true' }}
        shell: bash
        env:
          CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
        run: node .github/scripts/ci_crypto.mjs wrap -- bash .github/scripts/print_crash_reports.sh
      - name: Encrypt failure artifacts
        if: ${{ failure() && steps.shard-support.outputs.run_shard == 'true' }}
        env:
          CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
        run: node .github/scripts/ci_crypto.mjs encrypt-artifact --base-dir repo/integration_test --out "$RUNNER_TEMP/layer1-screenshots-ios-shard-${{ matrix.shard }}.tar.gz.cenc1" screenshots
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.shard-support.outputs.run_shard == 'true' }}
        with:
          name: layer1-screenshots-ios-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/layer1-screenshots-ios-shard-${{ matrix.shard }}.tar.gz.cenc1
          if-no-files-found: ignore
