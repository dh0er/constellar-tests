name: Windows

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo that triggered this workflow"
        required: false
        default: ""
      source_ref:
        description: "Git ref in the source repo to test (e.g. refs/pull/123/merge or refs/heads/main)"
        required: false
        default: ""
      source_sha:
        description: "Commit SHA in the source repo to test (optional)"
        required: false
        default: ""
      source_pr:
        description: "PR number in the source repo (optional)"
        required: false
        default: ""

concurrency:
  group: >-
    tests-windows-${{ inputs.source_repo || github.repository }}-${{ inputs.source_pr || inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests on Windows (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      REPO_PATH: ${{ secrets.REPO_PATH }}
      ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
      TEST_SHARD_INDEX: ${{ matrix.shard }}
      TEST_SHARD_TOTAL: "2"
      TEST_SHARD_0_OFFSET_SECONDS: "90"
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH (deploy key)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.REPO_SSH_KEY }}
      - name: Clone repository
        shell: pwsh
        env:
          # Avoid ssh-keyscan on Windows runners (can fail due to KEX mismatch depending on ssh-keyscan binary).
          # Let OpenSSH accept GitHub's host key on first use.
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new
        run: git clone --quiet "${{ secrets.REPO_PATH }}" repo
      - name: Checkout requested source ref/SHA (optional)
        if: ${{ inputs.source_ref != '' || inputs.source_sha != '' }}
        shell: pwsh
        working-directory: repo
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.source_ref }}" -ne "") {
            git fetch --quiet --no-tags --prune origin "${{ inputs.source_ref }}"
            git checkout --quiet --detach FETCH_HEAD
          } elseif ("${{ inputs.source_sha }}" -ne "") {
            try { git fetch --quiet --no-tags --prune origin "${{ inputs.source_sha }}" } catch { }
            git checkout --quiet --detach "${{ inputs.source_sha }}"
          }
      - name: Check integration sharding support in source repo
        id: shard-support
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "TEST_SHARD_INDEX" repo/test.py 2>/dev/null; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "run_shard=true" >> "$GITHUB_OUTPUT"
            echo "Source repo supports integration sharding (shard ${{ matrix.shard }}/${{ env.TEST_SHARD_TOTAL }})."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ matrix.shard }}" == "0" ]]; then
              echo "run_shard=true" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks sharding support; shard 0 will run the full suite."
            else
              echo "run_shard=false" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks sharding support; shard ${{ matrix.shard }} exiting early."
            fi
          fi
      - uses: actions/setup-python@v7
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          python-version: "3.11"
          architecture: x64
      - name: Read pinned Flutter version from source repo
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        id: flutter-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f repo/.flutter-version ]]; then
            version="$(tr -d '\r\n' < repo/.flutter-version)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Flutter pin: $version" >&2; exit 1; }
          else
            # Source refs from before the pin (e.g. main) keep the previous toolchain.
            version="3.41.2"
            echo "No .flutter-version in the source repo; falling back to Flutter $version"
          fi
          echo "Using Flutter $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v7
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          ruby-version: "3.3"
      - name: Run interpreter (execute 'run' steps from cloned workflow)
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        shell: pwsh
        env:
          CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
        run: node .github/scripts/ci_crypto.mjs wrap -- ruby .github/scripts/run_workflow_run_steps.rb --workflow repo/.github/workflows/tests-windows.yml --job layer1-tests --default-working-directory repo
      - name: Encrypt failure artifacts
        if: ${{ failure() && steps.shard-support.outputs.run_shard == 'true' }}
        shell: pwsh
        env:
          CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
        run: node .github/scripts/ci_crypto.mjs encrypt-artifact --base-dir repo/integration_test --out "$env:RUNNER_TEMP/layer1-screenshots-windows-shard-${{ matrix.shard }}.tar.gz.cenc1" screenshots
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.shard-support.outputs.run_shard == 'true' }}
        with:
          name: layer1-screenshots-windows-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/layer1-screenshots-windows-shard-${{ matrix.shard }}.tar.gz.cenc1
          if-no-files-found: ignore
