name: Linux

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo that triggered this workflow"
        required: false
        default: ""
      source_ref:
        description: "Git ref in the source repo to test (e.g. refs/pull/123/merge or refs/heads/main)"
        required: false
        default: ""
      source_sha:
        description: "Commit SHA in the source repo to test (optional)"
        required: false
        default: ""
      source_pr:
        description: "PR number in the source repo (optional)"
        required: false
        default: ""

concurrency:
  group: >-
    tests-linux-${{ inputs.source_repo || github.repository }}-${{ inputs.source_pr || inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests on Linux (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "vps-contract"
            artifact_suffix: "vps-contract"
            role: "vps-contract"
            shard: "0"
          - label: "host"
            artifact_suffix: "host"
            role: "host"
            shard: "0"
          - label: "sql"
            artifact_suffix: "sql"
            role: "sql"
            shard: "0"
          - label: "shard 0"
            artifact_suffix: "shard-0"
            role: "integration"
            shard: "0"
          - label: "shard 1"
            artifact_suffix: "shard-1"
            role: "integration"
            shard: "1"
          - label: "shard 2"
            artifact_suffix: "shard-2"
            role: "integration"
            shard: "2"
          - label: "shard 3"
            artifact_suffix: "shard-3"
            role: "integration"
            shard: "3"
    env:
      REPO_PATH: ${{ secrets.REPO_PATH }}
      ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
      TEST_RUNNER_ROLE: ${{ matrix.role }}
      TEST_SHARD_INDEX: ${{ matrix.shard }}
      TEST_SHARD_TOTAL: "4"
      TEST_SHARD_0_OFFSET_SECONDS: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH (deploy key)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.REPO_SSH_KEY }}
      - name: Trust github.com host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Clone repository
        run: git clone --quiet "${{ secrets.REPO_PATH }}" repo
      - name: Checkout requested source ref/SHA (optional)
        if: ${{ inputs.source_ref != '' || inputs.source_sha != '' }}
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.source_ref }}" ]; then
            git fetch --quiet --no-tags --prune origin "${{ inputs.source_ref }}"
            git checkout --quiet --detach FETCH_HEAD
          elif [ -n "${{ inputs.source_sha }}" ]; then
            git fetch --quiet --no-tags --prune origin "${{ inputs.source_sha }}" || true
            git checkout --quiet --detach "${{ inputs.source_sha }}"
          fi
      - name: Check integration sharding support in source repo
        id: shard-support
        shell: bash
        run: |
          set -euo pipefail
          HAS_SHARDING=0
          HAS_ROLE=0
          HAS_VPS_ROLE=0
          HAS_SQL_ROLE=0
          if grep -q "TEST_SHARD_INDEX" repo/test.py 2>/dev/null; then
            HAS_SHARDING=1
          fi
          if grep -q "TEST_RUNNER_ROLE" repo/.github/scripts/tests-linux/layer2-tests/run-tests.sh 2>/dev/null; then
            HAS_ROLE=1
          fi
          if grep -q "vps-contract)" repo/.github/scripts/tests-linux/layer2-tests/run-tests.sh 2>/dev/null; then
            HAS_VPS_ROLE=1
          fi
          if grep -q "sql)" repo/.github/scripts/tests-linux/layer2-tests/run-tests.sh 2>/dev/null; then
            HAS_SQL_ROLE=1
          fi

          if [[ "${{ matrix.role }}" == "vps-contract" ]]; then
            if [[ "$HAS_VPS_ROLE" == "1" ]]; then
              echo "supported=true" >> "$GITHUB_OUTPUT"
              echo "run_shard=true" >> "$GITHUB_OUTPUT"
              echo "Source repo supports TEST_RUNNER_ROLE=vps-contract split."
            else
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "run_shard=false" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks vps-contract role split; host/shard 0 covers it."
            fi
          elif [[ "${{ matrix.role }}" == "sql" ]]; then
            if [[ "$HAS_SQL_ROLE" == "1" ]]; then
              echo "supported=true" >> "$GITHUB_OUTPUT"
              echo "run_shard=true" >> "$GITHUB_OUTPUT"
              echo "Source repo supports TEST_RUNNER_ROLE=sql split."
            else
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "run_shard=false" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks sql role split; integration shard 0 covers it."
            fi
          elif [[ "${{ matrix.role }}" == "host" ]]; then
            if [[ "$HAS_ROLE" == "1" ]]; then
              echo "supported=true" >> "$GITHUB_OUTPUT"
              echo "run_shard=true" >> "$GITHUB_OUTPUT"
              echo "Source repo supports TEST_RUNNER_ROLE=host split."
            else
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "run_shard=false" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks TEST_RUNNER_ROLE split; shard 0 covers host suites."
            fi
          elif [[ "$HAS_SHARDING" == "1" ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "run_shard=true" >> "$GITHUB_OUTPUT"
            if [[ "$HAS_SQL_ROLE" == "1" ]]; then
              echo "TEST_RUN_SQL_IN_INTEGRATION_SHARD_0=0" >> "$GITHUB_ENV"
            else
              echo "TEST_SHARD_0_OFFSET_SECONDS=150" >> "$GITHUB_ENV"
            fi
            echo "Source repo supports integration sharding (role=${{ matrix.role }}, shard ${{ matrix.shard }}/${{ env.TEST_SHARD_TOTAL }})."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ matrix.shard }}" == "0" ]]; then
              echo "run_shard=true" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks sharding support; shard 0 will run the full suite."
            else
              echo "run_shard=false" >> "$GITHUB_OUTPUT"
              echo "Source repo lacks sharding support; shard ${{ matrix.shard }} exiting early."
            fi
          fi
      - uses: actions/setup-python@v7
        if: ${{ steps.shard-support.outputs.run_shard == 'true' && matrix.role == 'vps-contract' }}
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/setup-node@v7
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          node-version: "24.15.0"
          check-latest: false
      - name: Read pinned Flutter version from source repo
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        id: flutter-version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f repo/.flutter-version ]]; then
            version="$(tr -d '\r\n' < repo/.flutter-version)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Flutter pin: $version" >&2; exit 1; }
          else
            # Source refs from before the pin (e.g. main) keep the previous toolchain.
            version="3.41.2"
            echo "No .flutter-version in the source repo; falling back to Flutter $version"
          fi
          echo "Using Flutter $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: "stable"
          cache: true
      - name: Read pinned Supabase CLI version from source repo
        if: ${{ steps.shard-support.outputs.run_shard == 'true' && (matrix.role == 'integration' || matrix.role == 'sql') }}
        id: supabase-cli-version
        shell: bash
        run: |
          set -euo pipefail
          # The interpreter skips `uses:` steps of the source workflow, so read
          # the CLI pin it declares for supabase/setup-cli and install that.
          version="$(awk '/supabase\/setup-cli@/{found=1} found && /version:/{print $2; exit}' repo/.github/workflows/tests-linux.yml | tr -d '"\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Source refs from before the pin declare `latest` (or nothing); keep that.
            echo "No exact Supabase CLI pin in the source workflow ('$version'); using '${version:-latest}'"
            version="${version:-latest}"
          fi
          echo "Using Supabase CLI $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: ${{ steps.shard-support.outputs.run_shard == 'true' && (matrix.role == 'integration' || matrix.role == 'sql') }}
        with:
          version: ${{ steps.supabase-cli-version.outputs.version }}
      - uses: ruby/setup-ruby@v1
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        with:
          ruby-version: "3.3"
      - name: Run interpreter (execute 'run' steps from cloned workflow)
        if: ${{ steps.shard-support.outputs.run_shard == 'true' }}
        env:
          CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
        run: node .github/scripts/ci_crypto.mjs wrap -- ruby .github/scripts/run_workflow_run_steps.rb --workflow repo/.github/workflows/tests-linux.yml --job layer2-tests --default-working-directory repo
      - name: Encrypt failure artifacts
        if: ${{ failure() && steps.shard-support.outputs.run_shard == 'true' }}
        env:
          CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
        run: node .github/scripts/ci_crypto.mjs encrypt-artifact --base-dir repo/integration_test --out "$RUNNER_TEMP/layer2-screenshots-linux-${{ matrix.artifact_suffix }}.tar.gz.cenc1" screenshots
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.shard-support.outputs.run_shard == 'true' }}
        with:
          name: layer2-screenshots-linux-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/layer2-screenshots-linux-${{ matrix.artifact_suffix }}.tar.gz.cenc1
          if-no-files-found: ignore
