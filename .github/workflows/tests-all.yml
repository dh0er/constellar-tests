name: Run All Tests

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch or tag to run on (default: current ref)"
                required: false
                default: ""
            source_repo:
                description: "Source repo that triggered this workflow"
                required: false
                default: ""
            source_ref:
                description: "Git ref in the source repo to test (e.g. refs/pull/123/merge or refs/heads/main)"
                required: false
                default: ""
            source_sha:
                description: "Commit SHA in the source repo to test (optional)"
                required: false
                default: ""
            source_pr:
                description: "PR number in the source repo (optional)"
                required: false
                default: ""

permissions:
    contents: read
    actions: write

concurrency:
    group: >-
        tests-all-${{ inputs.source_repo || github.repository }}-${{ inputs.source_pr || inputs.source_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    dispatch:
        name: Dispatch and monitor all test workflows
        runs-on: ubuntu-latest
        timeout-minutes: 240
        steps:
            - name: Trigger and wait for all platform test workflows
              id: dispatch_and_wait
              uses: actions/github-script@v9
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require("fs");

                      // Dispatch slowest/macOS-limited workflows first so they claim
                      // runner capacity immediately without waiting behind faster jobs.
                      const workflowFiles = [
                        "tests-ios.yml",
                        "tests-macos.yml",
                        "tests-android.yml",
                        "tests-linux.yml",
                        "tests-windows.yml",
                        "tests-web.yml",
                      ];

                      const refInput = "${{ inputs.ref }}".trim();
                      const ref = refInput || context.ref.replace(/^refs\/(heads|tags)\//, "");
                      const sourceRepoInput = "${{ inputs.source_repo }}".trim();
                      const sourceRefInput = "${{ inputs.source_ref }}".trim();
                      const sourceShaInput = "${{ inputs.source_sha }}".trim();
                      let sourcePrInput = "${{ inputs.source_pr }}".trim();

                      // Derive PR number from a refs/pull/<n>/... ref when not explicitly provided.
                      if (!sourcePrInput && /^refs\/pull\/(\d+)\//.test(sourceRefInput)) {
                        sourcePrInput = sourceRefInput.match(/^refs\/pull\/(\d+)\//)[1];
                      }

                      const dispatchStartedAtMs = Date.now();
                      // Resolve the requested ref to an immutable commit SHA so:
                      // - all dispatched workflows run the exact same commit
                      // - we can reliably discover the created workflow runs via head_sha
                      let targetSha = context.sha;
                      if (refInput) {
                        const commit = await github.rest.repos.getCommit({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: refInput,
                        });
                        targetSha = commit.data.sha;
                      }

                      const tokenUser = process.env.GITHUB_ACTOR;
                      const dispatchInputs = {
                        ...(sourceRepoInput ? { source_repo: sourceRepoInput } : {}),
                        ...(sourceRefInput ? { source_ref: sourceRefInput } : {}),
                        ...(sourceShaInput ? { source_sha: sourceShaInput } : {}),
                        ...(sourcePrInput ? { source_pr: sourcePrInput } : {}),
                      };

                      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                      const deadlineMs = dispatchStartedAtMs + (220 * 60 * 1000);
                      const createdAfter = new Date(dispatchStartedAtMs - 60_000);

                      const states = workflowFiles.map((workflow_id) => ({
                        workflow_file: workflow_id,
                        ref,
                        target_sha: targetSha,
                        run_id: "",
                        run_url: "",
                        status: "pending",
                        conclusion: "",
                      }));

                      // 1) Dispatch all 6 workflows sequentially in order (takes ~2s total).
                      for (const st of states) {
                        core.info(`Dispatching ${st.workflow_file} on ref=${ref} (targetSha=${targetSha}, actor=${tokenUser})`);
                        try {
                          await github.rest.actions.createWorkflowDispatch({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            workflow_id: st.workflow_file,
                            ref: targetSha,
                            inputs: dispatchInputs,
                          });
                        } catch (e) {
                          core.warning(`Dispatch with ref=SHA failed for ${st.workflow_file}; falling back to ref=${ref}. Error: ${e?.message ?? e}`);
                          await github.rest.actions.createWorkflowDispatch({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            workflow_id: st.workflow_file,
                            ref,
                            inputs: dispatchInputs,
                          });
                        }
                      }

                      // 2) Discover all 6 created runs.
                      const discoveryDeadlineMs = Math.min(deadlineMs, Date.now() + 5 * 60 * 1000);
                      while (states.some((s) => !s.run_id) && Date.now() < discoveryDeadlineMs) {
                        for (const st of states) {
                          if (st.run_id) continue;
                          const runs = await github.rest.actions.listWorkflowRuns({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            workflow_id: st.workflow_file,
                            event: "workflow_dispatch",
                            per_page: 20,
                          });
                          const all = (runs.data.workflow_runs || [])
                            .filter((r) => r && new Date(r.created_at) >= createdAfter)
                            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                          const shaCandidates = all.filter((r) => (r.head_sha ?? "") === targetSha);
                          const branchCandidates = all.filter((r) => (r.head_branch ?? "") === ref);
                          const candidates = shaCandidates.length > 0 ? shaCandidates : branchCandidates;
                          const found = candidates.find((r) => {
                            const actor = r.triggering_actor?.login ?? r.actor?.login;
                            return !tokenUser || !actor || actor === tokenUser;
                          }) || candidates[0] || null;
                          if (found) {
                            st.run_id = String(found.id);
                            st.run_url = found.html_url;
                            st.status = found.status || "queued";
                            st.conclusion = found.conclusion || "";
                            core.info(`Discovered ${st.workflow_file}: run id=${st.run_id} url=${st.run_url}`);
                          }
                        }
                        if (states.some((s) => !s.run_id)) {
                          await sleep(5000);
                        }
                      }

                      for (const st of states) {
                        if (!st.run_id) {
                          st.status = "completed";
                          st.conclusion = "timed_out";
                          core.warning(`Timed out discovering run for ${st.workflow_file} (ref=${ref}, targetSha=${targetSha}).`);
                        }
                      }

                      // 3) Poll all discovered runs until completed (or overall deadline).
                      while (states.some((s) => s.status !== "completed") && Date.now() < deadlineMs) {
                        for (const st of states) {
                          if (st.status === "completed" || !st.run_id) continue;
                          const runRes = await github.rest.actions.getWorkflowRun({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            run_id: Number(st.run_id),
                          });
                          const prevStatus = st.status;
                          st.status = runRes.data.status || "unknown";
                          st.conclusion = runRes.data.conclusion || "";
                          if (st.status !== prevStatus || st.status === "completed") {
                            core.info(`${st.workflow_file} (${st.run_id}): status=${st.status} conclusion=${st.conclusion}`);
                          }
                        }
                        if (states.some((s) => s.status !== "completed")) {
                          await sleep(15000);
                        }
                      }

                      for (const st of states) {
                        if (st.status !== "completed") {
                          st.status = "completed";
                          st.conclusion = "timed_out";
                          core.warning(`Timed out waiting for ${st.workflow_file} run id=${st.run_id} to complete.`);
                        }
                      }

                      const anyFailed = states.some((s) => s.conclusion !== "success");
                      fs.writeFileSync("downstream-results.json", JSON.stringify(states, null, 2));
                      core.setOutput("any_failed", anyFailed ? "true" : "false");

                      await core.summary
                        .addHeading("Run All Tests — Downstream Results")
                        .addTable([
                          [
                            { data: "Workflow", header: true },
                            { data: "Conclusion", header: true },
                            { data: "Run", header: true },
                          ],
                          ...states.map((s) => [
                            s.workflow_file,
                            s.conclusion || "unknown",
                            s.run_url ? `<a href="${s.run_url}">${s.run_id}</a>` : "n/a",
                          ]),
                        ])
                        .write();

            - name: Record downstream run info
              if: ${{ always() }}
              run: |
                  set -euo pipefail
                  if [[ -f downstream-results.json ]]; then
                    cat downstream-results.json
                  else
                    echo "downstream-results.json not found"
                  fi

            - name: Download logs and artifacts for failed downstream runs
              if: ${{ always() && steps.dispatch_and_wait.outputs.any_failed == 'true' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  mkdir -p downstream-logs downstream-artifacts
                  python3 - <<'PY' > failed-runs.tsv
                  import json, pathlib
                  p = pathlib.Path("downstream-results.json")
                  if not p.exists():
                      raise SystemExit(0)
                  for item in json.loads(p.read_text(encoding="utf-8")):
                      if item.get("conclusion") != "success" and item.get("run_id"):
                          print(f"{item['workflow_file']}\t{item['run_id']}")
                  PY

                  while IFS=$'\t' read -r wf run_id; do
                    [[ -z "${run_id}" ]] && continue
                    zip_path="downstream-logs/${wf}-run-${run_id}.zip"
                    echo "Downloading logs for ${wf} run ${run_id} -> ${zip_path}"
                    curl -sSfL \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/logs" \
                      -o "${zip_path}" || echo "Warning: failed to download logs for ${wf} run ${run_id}"

                    out_dir="downstream-artifacts/${wf}-run-${run_id}"
                    mkdir -p "${out_dir}"
                    artifacts_json_path="${out_dir}/_artifacts.json"
                    if curl -sSfL \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -o "${artifacts_json_path}" \
                      "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts?per_page=100"; then
                      python3 - "${artifacts_json_path}" <<'PY' > "${out_dir}/_artifact_index.txt"
                  import json, sys, re
                  path = sys.argv[1]
                  try:
                      raw = open(path, "r", encoding="utf-8", errors="replace").read()
                      data = json.loads(raw) if raw.strip() else {}
                  except Exception:
                      data = {}
                  for a in data.get("artifacts", []) or []:
                      art_id = a.get("id")
                      name = a.get("name") or "artifact"
                      if art_id:
                          safe = re.sub(r"[^A-Za-z0-9._-]+", "_", name)
                          print(f"{art_id}\t{safe}\t{name}")
                  PY
                      while IFS=$'\t' read -r art_id safe_name orig_name; do
                        [[ -z "${art_id}" ]] && continue
                        curl -sSfL \
                          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                          -H "Accept: application/vnd.github+json" \
                          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${art_id}/zip" \
                          -o "${out_dir}/${safe_name}.zip" || true
                      done < "${out_dir}/_artifact_index.txt"
                    fi
                  done < failed-runs.tsv

            - name: Checkout helper scripts for failure bundle encryption
              if: ${{ always() && steps.dispatch_and_wait.outputs.any_failed == 'true' }}
              uses: actions/checkout@v7
              with:
                  clean: false

            - name: Setup Node for failure bundle encryption
              if: ${{ always() && steps.dispatch_and_wait.outputs.any_failed == 'true' }}
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: Encrypt downstream logs and artifacts bundles
              if: ${{ always() && steps.dispatch_and_wait.outputs.any_failed == 'true' }}
              env:
                  CI_LOG_PUBLIC_KEY: ${{ secrets.CI_LOG_PUBLIC_KEY }}
              run: |
                  set -euo pipefail
                  node .github/scripts/ci_crypto.mjs encrypt-artifact --out "$RUNNER_TEMP/downstream-logs-failed.tar.gz.cenc1" downstream-logs
                  node .github/scripts/ci_crypto.mjs encrypt-artifact --out "$RUNNER_TEMP/downstream-artifacts-failed.tar.gz.cenc1" downstream-artifacts

            - name: Upload downstream logs bundle
              if: ${{ always() && steps.dispatch_and_wait.outputs.any_failed == 'true' }}
              uses: actions/upload-artifact@v7
              with:
                  name: downstream-logs-failed
                  path: ${{ runner.temp }}/downstream-logs-failed.tar.gz.cenc1
                  if-no-files-found: ignore

            - name: Upload downstream artifacts bundle
              if: ${{ always() && steps.dispatch_and_wait.outputs.any_failed == 'true' }}
              uses: actions/upload-artifact@v7
              with:
                  name: downstream-artifacts-failed
                  path: ${{ runner.temp }}/downstream-artifacts-failed.tar.gz.cenc1
                  if-no-files-found: ignore

            - name: Fail if any downstream workflow did not succeed
              if: ${{ steps.dispatch_and_wait.outputs.any_failed == 'true' }}
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import json, pathlib
                  for item in json.loads(pathlib.Path("downstream-results.json").read_text(encoding="utf-8")):
                      if item.get("conclusion") != "success":
                          print(f"FAILED: {item['workflow_file']} conclusion={item.get('conclusion')} url={item.get('run_url')}")
                  PY
                  exit 1
